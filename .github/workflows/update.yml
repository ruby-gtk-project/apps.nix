# The registry is the source of truth; this keeps flake.nix, apps.json and the
# README list in step with it, and re-locks so the pinned port revisions follow
# each fork's `ruby` branch.
name: update

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: regenerate from the registry
        run: python3 scripts/update.py

      # The inputs are git+https, so this needs no GitHub token: `github:` refs
      # would resolve 89 branches through api.github.com and hit the
      # unauthenticated rate limit.
      - name: re-lock the ports
        run: nix flake lock --recreate-lock-file

      - name: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix flake.lock apps.json README.md
          git diff --cached --quiet && exit 0
          git commit -m "ports: nightly sync"
          git push
