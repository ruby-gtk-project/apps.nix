# Every app that its fork's flake can build, built. A port whose flake does not
# yet expose a package for this system is in apps.json but not in `packages`,
# so it is not built here either.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: which apps are buildable
        run: nix flake show --json | python3 -c 'import json,sys; print("\n".join(sorted(json.load(sys.stdin)["packages"]["x86_64-linux"])))'

      # `checks` is the same set as `packages`, so this builds every app the
      # ports can currently build.
      - name: build them
        run: nix flake check --print-build-logs
